<!DOCTYPE html>
<html>
<head>
    <!--
    * Author:         zkk995
    -->
    <meta charset="utf-8" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="author" content="copy from BieYuu" />
    <meta name="renderer" content="webkit">
    <meta name="description" content="xiao Xian's Blog" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="/css/default.css" type="text/css" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="alternate" type="application/atom+xml" title="Recent Entries" href="{{ site.feed }}" />
    <script src="/js/jquery-1.7.1.min.js" type="text/javascript"></script>
    
    <script src=" http://mathjax.b0.upaiyun.com/MathJax.js?config=TeX-AMS-MML_HTMLorMML" type="text/javascript"></script>
    <style type="text/css"> 
    table {
        margin-bottom    : 10px;
        margin-left      : 32px;
        margin-right     : 32px;
        box-shadow       : 0px 0px 4px #888888;
        border-collapse  : collapse;
        border           : 1px solid #888888;
        text-align       : center;
        font-size        : small;
    }
    th { 
        padding          : 2px;
        padding-left     : 4px;
        padding-right    : 4px;
        background-color : #E0E0E0;
        font-family      : 黑体;
        font-style       : normal;
        font-weight      : normal;
        border           : 1px solid #888888;
    }
    td {
        padding          : 2px;
        padding-left     : 4px;
        padding-right    : 4px;
        background-color : #FCFCFC;
        font-family      : 'wdsong';
        border           : 1px dotted #888888;
    }    
    </style>
    
    

</head>
<body>

    <div class="home-menu">
        <div class="home-icon-con">
            <a class="home-menu-icon" href="/">zkk995</a>
            <a class="home-follow" href="#" title="Contact Me">+</a>
        </div>
        <div class="home-contact">
            <a href="http://weibo.com/zkk995/" target="_blank" style="margin-left:-5px;"><img src="http://www.weibo.com/favicon.ico" alt="" width="25"/></a>
        </div>
    </div>

    {{ content }}

    <script type="text/javascript">
        $(function(){
            $('.home-follow').click(function(e){
                e.preventDefault();

                if($('.home-contact').is(':visible')){
                    $('.home-contact').slideUp(100);
                }else{
                    $('.home-contact').slideDown(100);
                }
            });
        })
    </script>
</body>
</html>
