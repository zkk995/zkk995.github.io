<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文解读清单 · 科科</title>
<style>
  :root {
    --paper: #faf7f2; --ink: #2d2a26; --ink-soft: #6f675e;
    --red: #c8402e; --red-deep: #a33223; --card: #fff; --line: rgba(45,42,38,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(900px 400px at 50% -100px, rgba(200,64,46,.08), transparent 70%), var(--paper);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    line-height: 1.8; min-height: 100vh; padding: 0 20px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .top { padding: 44px 0 26px; text-align: center; }
  .top .star-row { color: var(--red); letter-spacing: .6em; font-size: 18px; margin-bottom: 12px; }
  .top h1 { font-size: 32px; letter-spacing: .08em; }
  .top p { color: var(--ink-soft); margin-top: 8px; font-size: 15.5px; }
  .top a { color: var(--red-deep); text-decoration: none; }
  .paper-list { display: grid; gap: 16px; margin-top: 10px; }
  .paper {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 24px; transition: transform .18s, box-shadow .18s;
  }
  .paper:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(45,42,38,.1); }
  .p-tag {
    display: inline-block; margin-bottom: 6px; font-size: 12.5px;
    color: var(--red-deep); background: rgba(200,64,46,.08);
    padding: 3px 12px; border-radius: 999px;
  }
  .p-title { font-size: 17px; font-weight: 700; }
  .p-title .arrow { color: var(--red); }
  .p-meta { margin-top: 4px; color: var(--ink-soft); font-size: 13.5px; }
  footer { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 34px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="star-row">★ ★ ★</div>
    <h1>AI 论文解读清单</h1>
    <p>papers 目录下的全部解读，新加的排最上 · <a href="/">← 回主页</a></p>
  </div>
  <div class="paper-list" id="paper-list"></div>
  <footer>本页由 papers.js 实时生成，向 papers 目录添加解读文件即自动收录</footer>
</div>
<script src="../papers.js"></script>
<script>renderPaperList();</script>
</body>
</html>
